basePath: /
definitions:
  entities.Book:
    properties:
      author:
        type: string
      available_date:
        type: string
      category:
        $ref: '#/definitions/entities.Category'
      category_id:
        type: integer
      description:
        type: string
      discount:
        $ref: '#/definitions/entities.Discount'
      discount_id:
        type: integer
      id:
        type: integer
      isbn:
        type: string
      language:
        type: string
      link:
        type: string
      preorder:
        type: boolean
      price:
        type: number
      publisher:
        $ref: '#/definitions/entities.Publisher'
      publisher_id:
        type: integer
      rating:
        type: number
      title:
        type: string
    type: object
  entities.Category:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  entities.Discount:
    properties:
      description:
        type: string
      id:
        type: integer
      percentage:
        type: number
      title:
        type: string
    type: object
  entities.Orders:
    properties:
      address:
        type: string
      id:
        type: integer
      items:
        type: string
      status:
        type: string
      total_amount:
        type: number
      user:
        $ref: '#/definitions/entities.User'
      user_id:
        type: integer
    type: object
  entities.Publisher:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
    type: object
  entities.Review:
    properties:
      book:
        $ref: '#/definitions/entities.Book'
      book_id:
        type: integer
      comment:
        type: string
      id:
        type: integer
      rating:
        type: string
      user:
        $ref: '#/definitions/entities.User'
      user_id:
        type: integer
    type: object
  entities.User:
    properties:
      address:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      password:
        type: string
      phone:
        type: string
      reg_date:
        type: string
      role:
        type: string
    type: object
